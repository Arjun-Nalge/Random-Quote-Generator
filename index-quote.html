<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspiration Pulse | Arjun-N</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Deep, sophisticated base color */
            background-color: #0a0c14; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
            position: relative;
        }

        /* Modern Mesh Gradient Background */
        .mesh-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0c14 0%, #121421 100%);
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: move 20s infinite alternate;
        }

        .blob-1 {
            top: -100px;
            left: -100px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.3) 0%, rgba(0,0,0,0) 70%);
        }

        .blob-2 {
            bottom: -150px;
            right: -100px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(0,0,0,0) 70%);
            animation-duration: 25s;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, rgba(0,0,0,0) 70%);
            animation-duration: 30s;
        }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(100px, 50px) scale(1.1); }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 440px;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #resultArea {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #resultArea.show {
            max-height: 400px;
            opacity: 1;
            margin-top: 30px;
        }

        .btn-modern {
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            background: #f8fafc;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #000;
            border-radius: 50%;
            display: none;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .author-text {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            font-weight: 500;
        }

        .author-text span { color: rgba(255,255,255,0.8); font-weight: 700; }
        
        /* Subtle texture overlay */
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="mesh-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="grain"></div>

    <div class="glass-card">
        <div class="mb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-2 text-white">Inspiration AI</h1>
            <p class="text-slate-400 text-sm font-medium">Generate a moment of modern wisdom.</p>
        </div>

        <button onclick="fetchQuote()" id="mainBtn" class="btn-modern">
            <span id="btnLabel">Generate Quote</span>
            <div id="loader" class="loader"></div>
        </button>

        <div id="resultArea">
            <div class="p-6 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-sm">
                <p id="quoteText" class="text-xl font-medium leading-relaxed italic text-slate-100">
                    "Wisdom is loading..."
                </p>
                <div class="mt-6 flex items-center gap-3">
                    <div class="h-[1px] flex-1 bg-gradient-to-r from-indigo-500/50 to-transparent"></div>
                    <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-[0.2em]">Serverless Engine</span>
                </div>
            </div>
        </div>
    </div>

    <div class="author-text">
        Created by <span>Arjun-N</span>
    </div>

    <script>
        async function fetchQuote() {
            const btnLabel = document.getElementById('btnLabel');
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            const quoteText = document.getElementById('quoteText');
            const btn = document.getElementById('mainBtn');

            btnLabel.innerText = "Connecting";
            loader.style.display = "block";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.8";

            resultArea.classList.remove('show');

            try {
                // Using your existing API endpoint
                const response = await fetch("https://nkue7661q5.execute-api.us-east-1.amazonaws.com/quote");
                const data = await response.json();

                setTimeout(() => {
                    quoteText.innerText = `"${data.quote}"`;
                    resultArea.classList.add('show');
                    
                    btnLabel.innerText = "Generate Another";
                    loader.style.display = "none";
                    btn.style.pointerEvents = "auto";
                    btn.style.opacity = "1";
                }, 400);

            } catch (error) {
                quoteText.innerText = "Unable to reach the server. Please try again.";
                resultArea.classList.add('show');
                btnLabel.innerText = "Try Again";
                loader.style.display = "none";
                btn.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
