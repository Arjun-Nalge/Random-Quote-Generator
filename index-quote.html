<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspiration Pulse | Arjun-N</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505; /* True dark for professional look */
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        /* Ambient background glows */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: 0;
            filter: blur(60px);
        }

        .glow-1 { top: -10%; left: -10%; }
        .glow-2 { bottom: -10%; right: -10%; }

        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            z-index: 10;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hide text/result area initially */
        #resultArea {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #resultArea.show {
            max-height: 300px;
            opacity: 1;
            margin-top: 30px;
        }

        .btn-modern {
            background: #ffffff;
            color: #000000;
            font-weight: 700;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: none;
            cursor: pointer;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            background: #f0f0f0;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-modern:active { transform: translateY(0); }

        .loader {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: #000;
            border-radius: 50%;
            display: none;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .author-text {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }

        .author-text span { color: rgba(255,255,255,0.7); font-weight: 600; }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="glass-card">
        <div class="mb-8">
            <h1 class="text-2xl font-bold tracking-tight mb-2">Inspiration AI</h1>
            <p class="text-gray-400 text-sm">Click below to generate a modern insight.</p>
        </div>

        <button onclick="fetchQuote()" id="mainBtn" class="btn-modern">
            <span id="btnLabel">Generate Quote</span>
            <div id="loader" class="loader"></div>
        </button>

        <!-- Result area is hidden by default (max-height 0) -->
        <div id="resultArea">
            <div class="p-6 rounded-2xl bg-white/5 border border-white/5">
                <p id="quoteText" class="text-xl font-medium leading-relaxed italic text-gray-200">
                    "Loading wisdom..."
                </p>
                <div class="mt-4 flex items-center gap-2">
                    <div class="h-px flex-1 bg-white/10"></div>
                    <span class="text-[10px] font-mono text-gray-500 uppercase tracking-widest">AI Generated</span>
                </div>
            </div>
        </div>
    </div>

    <div class="author-text">
        Created by <span>Arjun-N</span>
    </div>

    <script>
        async function fetchQuote() {
            const btnLabel = document.getElementById('btnLabel');
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('resultArea');
            const quoteText = document.getElementById('quoteText');
            const btn = document.getElementById('mainBtn');

            // 1. Loading State
            btnLabel.innerText = "Processing";
            loader.style.display = "block";
            btn.style.pointerEvents = "none";
            btn.style.opacity = "0.8";

            // 2. Hide previous result if visible
            resultArea.classList.remove('show');

            try {
                const response = await fetch("https://nkue7661q5.execute-api.us-east-1.amazonaws.com/quote");
                const data = await response.json();

                // 3. Set text and reveal
                setTimeout(() => {
                    quoteText.innerText = `"${data.quote}"`;
                    resultArea.classList.add('show');
                    
                    // Reset button
                    btnLabel.innerText = "Generate Another";
                    loader.style.display = "none";
                    btn.style.pointerEvents = "auto";
                    btn.style.opacity = "1";
                }, 400); // Slight delay for smooth transition

            } catch (error) {
                quoteText.innerText = "The connection failed. Please try again.";
                resultArea.classList.add('show');
                btnLabel.innerText = "Try Again";
                loader.style.display = "none";
                btn.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
